<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Basement Ready 3D clips</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=Geist+Mono:wght@500&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F4F6F2; }
      #root { position: relative; }
      #labels { position: absolute; inset: 0; pointer-events: none; }
      .tag { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
      .tag .card { position: absolute; left: 0; bottom: 46px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px;
        white-space: nowrap; padding: 11px 18px 11px 14px; background: #FBFCFA; border: 1.5px solid #0F2A1E; border-radius: 6px;
        font: 600 25px/1 "Hanken Grotesk", system-ui, sans-serif; color: #0F2A1E; letter-spacing: -0.005em; }
      .tag .card i { width: 14px; height: 14px; border-radius: 999px; background: var(--c); flex: none; }
      .tag .card b { font: 500 20px/1 "Geist Mono", ui-monospace, monospace; color: #4A5D52; margin-left: 4px; }
      .tag .stem { position: absolute; left: -1px; bottom: 6px; width: 2px; height: 40px; background: #0F2A1E; }
      .tag .dot { position: absolute; left: -7px; top: -7px; width: 10px; height: 10px; border-radius: 999px; background: var(--c); border: 2px solid #FBFCFA; }
      .tag.flat .card { bottom: auto; top: 0; transform: translate(-50%, -50%); background: transparent; border: 0; padding: 0;
        font: 600 25px/1 "Hanken Grotesk", system-ui, sans-serif; flex-direction: column; gap: 8px; text-align: center; }
      .tag.flat .card b { margin-left: 0; font-size: 19px; }
      .tag.flat .stem, .tag.flat .dot { display: none; }
      .tag.dim .card { background: #0F2A1E; color: #F4F6F2; border-color: #0F2A1E; font: 500 24px/1 "Geist Mono", ui-monospace, monospace; padding: 9px 14px; }
      .tag.dim .stem, .tag.dim .dot { display: none; }
      .tag.dim .card { bottom: auto; top: 0; transform: translate(-50%, -50%); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
